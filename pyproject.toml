[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "arxiv>=2.1",
    "pymupdf4llm>=0.0.17",
    "sentence-transformers>=3.3",
    "faiss-cpu>=1.9",
    "bm25s>=0.2",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "datasets>=3", "accelerate>=1.1"]

[tool.setuptools]
packages = ["rag"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E731"]
